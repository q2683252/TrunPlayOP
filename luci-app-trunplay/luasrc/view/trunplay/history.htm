<%# TrunPlay - Playback History Page %>

    <%+header%>
        <%+trunplay/custom_css%>
        <%+trunplay/common_js%>

            <h2>
                <%:播放历史%>
            </h2>

            <div class="cbi-section">
                <div class="cbi-section-node">
                    <button class="cbi-button" onclick="trunplay.loadHistory()">
                        <%:刷新%>
                    </button>
                    <button class="cbi-button cbi-button-remove" onclick="trunplay.clearHistory()">
                        <%:清空历史%>
                    </button>
                </div>
            </div>

            <div class="cbi-section">
                <h3>
                    <%:历史记录%>
                </h3>
                <div class="tp-inline-filters">
                    <input type="text" id="history-filter-keyword" placeholder="搜索关键词" oninput="trunplay.applyFilters()">
                    <select id="history-filter-scope" onchange="trunplay.applyFilters()">
                        <option value="media">按媒体</option>
                        <option value="plan">按计划</option>
                        <option value="device">按设备</option>
                    </select>
                    <select id="history-filter-status" onchange="trunplay.applyFilters()">
                        <option value="">全部状态</option>
                        <option value="COMPLETED">已完成</option>
                        <option value="STOPPED">已停止</option>
                        <option value="ERROR">错误</option>
                        <option value="IN_PROGRESS">进行中</option>
                    </select>
                    <select id="history-page-size" onchange="trunplay.changePageSize(this.value)">
                        <option value="20">每页 20 条</option>
                        <option value="50">每页 50 条</option>
                        <option value="100">每页 100 条</option>
                    </select>
                    <button class="cbi-button" type="button" onclick="trunplay.resetFilters()">清空筛选</button>
                    <span id="history-filter-meta" class="tp-filter-meta">-</span>
                </div>
                <table class="cbi-section-table" id="history-table">
                    <tr class="cbi-section-table-titles">
                        <th>
                            <%:时间%>
                        </th>
                        <th>
                            <%:计划%>
                        </th>
                        <th>
                            <%:媒体%>
                        </th>
                        <th>
                            <%:设备%>
                        </th>
                        <th>
                            <%:播放时长%>
                        </th>
                        <th>
                            <%:状态%>
                        </th>
                    </tr>
                    <tr id="history-loading">
                        <td colspan="6">
                            <%:加载中...%>
                        </td>
                    </tr>
                </table>

                <div id="pagination" style="margin-top:10px;"></div>
            </div>

            <script type="text/javascript">
                //<![CDATA[
                var trunplay = {
                    apiBase: '<%=luci.dispatcher.build_url("admin/services/trunplay/api")%>',
                    currentPage: 1,
                    pageSize: 20,

                    api: function (path, method, body, callback) {
                        var xhr = new XMLHttpRequest();
                        xhr.open('POST', this.apiBase, true);
                        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                        xhr.onreadystatechange = function () {
                            if (xhr.readyState === 4) {
                                var data = null;
                                try { data = JSON.parse(xhr.responseText); } catch (e) { }
                                if (callback) callback(data, xhr.status);
                            }
                        };
                        var params = 'path=' + encodeURIComponent(path);
                        if (method) params += '&method=' + encodeURIComponent(method);
                        if (body) params += '&body=' + encodeURIComponent(JSON.stringify(body));
                        xhr.send(params);
                    },

                    formatDate: function (timestamp) {
                        if (!timestamp) return '-';
                        var d = new Date(timestamp);
                        if (isNaN(d.getTime())) return '-';
                        return d.toLocaleString('zh-CN');
                    },

                    formatDuration: function (ms) {
                        var s = Math.floor(ms / 1000);
                        var m = Math.floor(s / 60);
                        var sec = s % 60;
                        return m + '分' + sec + '秒';
                    },

                    statusText: {
                        'IN_PROGRESS': '进行中',
                        'COMPLETED': '已完成',
                        'STOPPED': '已停止',
                        'ERROR': '错误'
                    },

                    applyFilters: function () {
                        this.loadHistory(1);
                    },

                    resetFilters: function () {
                        var keywordEl = document.getElementById('history-filter-keyword');
                        var scopeEl = document.getElementById('history-filter-scope');
                        var statusEl = document.getElementById('history-filter-status');
                        if (keywordEl) keywordEl.value = '';
                        if (scopeEl) scopeEl.value = 'media';
                        if (statusEl) statusEl.value = '';
                        this.loadHistory(1);
                    },

                    changePageSize: function (value) {
                        var size = parseInt(value, 10);
                        if (!size || size < 1) size = 20;
                        this.pageSize = size;
                        this.loadHistory(1);
                    },

                    renderPagination: function (page, total) {
                        var container = document.getElementById('pagination');
                        if (!container) return;
                        var totalPages = Math.ceil(total / this.pageSize);
                        if (totalPages <= 1) {
                            container.innerHTML = '';
                            return;
                        }
                        var html = '共 ' + total + ' 条，第 ' + page + '/' + totalPages + ' 页 ';
                        if (page > 1) {
                            html += '<button class="cbi-button" onclick="trunplay.loadHistory(1)">首页</button> ';
                            html += '<button class="cbi-button" onclick="trunplay.loadHistory(' + (page - 1) + ')">上一页</button> ';
                        }
                        if (page < totalPages) {
                            html += '<button class="cbi-button" onclick="trunplay.loadHistory(' + (page + 1) + ')">下一页</button> ';
                            html += '<button class="cbi-button" onclick="trunplay.loadHistory(' + totalPages + ')">末页</button>';
                        }
                        container.innerHTML = html;
                    },

                    loadHistory: function (page) {
                        var self = this;
                        page = page || this.currentPage;
                        var table = document.getElementById('history-table');
                        var refreshBtn = document.getElementById('history-refresh-btn');
                        if (refreshBtn) { refreshBtn.disabled = true; refreshBtn.textContent = '加载中...'; }
                        while (table.rows.length > 1) { table.deleteRow(1); }
                        var loadingRow = table.insertRow(-1);
                        loadingRow.className = 'trunplay-loading-row';
                        loadingRow.innerHTML = '<td colspan="7">加载中...</td>';

                        var apiPath = this.buildHistoryQueryPath(page);
                        this.api(apiPath, 'GET', null, function (data) {
                            if (refreshBtn) { refreshBtn.disabled = false; refreshBtn.textContent = '刷新'; }
                            while (table.rows.length > 1) { table.deleteRow(1); }

                            if (!data) {
                                var errRow = table.insertRow(-1);
                                errRow.className = 'trunplay-empty-row';
                                errRow.innerHTML = '<td colspan="7">加载失败，请重试</td>';
                                self.showMessage('error', L.loadFail);
                                self.updateFilterMeta(0, 0);
                                document.getElementById('pagination').innerHTML = '';
                                return;
                            }

                            var items = Array.isArray(data.items) ? data.items : [];
                            self.lastTotal = parseInt(data.total || 0, 10) || 0;
                            self.currentPage = page;
                            self.updateFilterMeta(items.length, self.lastTotal);

                            if (!items.length) {
                                var row = table.insertRow(-1);
                                row.className = 'trunplay-empty-row';
                                row.innerHTML = '<td colspan="7">' + self.escapeHtml(self.lastTotal > 0 ? L.noMatch : '暂无播放历史。定时或手动触发播放后将在此显示记录。') + '</td>';
                                document.getElementById('pagination').innerHTML = '';
                                return;
                            }

                            items.forEach(function (item) {
                                var row = table.insertRow(-1);
                                var statusClass = item.end_status === 'COMPLETED' ? 'status-badge active' :
                                    item.end_status === 'ERROR' ? 'status-badge error' :
                                    item.end_status === 'IN_PROGRESS' ? 'status-badge playing' : 'status-badge stopped';
                                var thumb = self.buildThumbUrl(item);
                                row.innerHTML =
                                    '<td>' + self.escapeHtml(self.formatDate(item.actual_start_time)) + '</td>' +
                                    '<td>' + self.escapeHtml(item.plan_title || '-') + '</td>' +
                                    '<td><img class="tp-thumb-sm" src="' + thumb + '" alt="预览"></td>' +
                                    '<td>' + self.escapeHtml(item.media_name || '-') + '</td>' +
                                    '<td>' + self.escapeHtml(item.device_name || '-') + '</td>' +
                                    '<td>' + self.escapeHtml(self.formatDuration(item.played_duration || 0)) + '</td>' +
                                    '<td><span class="' + statusClass + '">' + self.escapeHtml(self.statusText[item.end_status] || item.end_status || '-') + '</span></td>';
                            });

                            self.renderPagination(page, self.lastTotal);
                        });
                    },

                    clearHistory: function () {
                        if (!confirm('确定要清空所有播放历史吗？此操作不可撤销。')) return;

                        this.api('/history', 'DELETE', null, function () {
                            trunplay.loadHistory(1);
                        });
                    },

                    init: function () {
                        var pageSizeEl = document.getElementById('history-page-size');
                        if (pageSizeEl) pageSizeEl.value = String(this.pageSize);
                        this.updateFilterMeta(0, 0);
                        this.loadHistory(1);
                    }
                };

                document.addEventListener('DOMContentLoaded', function () {
                    trunplay.init();
                });
                //]]>
            </script>

            <%+footer%>
