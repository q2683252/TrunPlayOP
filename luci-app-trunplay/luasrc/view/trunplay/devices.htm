<%# TrunPlay - Devices Management Page %>

<%+header%>
<%+trunplay/custom_css%>
<%+trunplay/common_js%>

<h2>
    <%:设备管理%>
</h2>
<div id="trunplay-message" role="alert" aria-live="polite"></div>

<div class="cbi-section compact-section">
    <div class="tp-plan-header">
        <div class="tp-plan-title"><%:设备操作%></div>
        <div class="tp-plan-actions">
            <button id="devices-discover-btn" class="cbi-button cbi-button-action" onclick="trunplay.discover(this)" aria-label="<%:扫描设备%>">
                <%:扫描设备%>
            </button>
            <button id="devices-refresh-btn" class="cbi-button" onclick="trunplay.loadDevices()">
                <%:刷新%>
            </button>
            <button class="cbi-button cbi-button-add" onclick="trunplay.showAddDevice()">
                <%:手动添加%>
            </button>
        </div>
    </div>

    <div class="tp-inline-filters">
        <input type="text" id="devices-filter-keyword" placeholder="按名称、IP、类型搜索" oninput="trunplay.applyFilters()">
        <select id="devices-filter-status" onchange="trunplay.applyFilters()">
            <option value=""><%:全部状态%></option>
            <option value="online"><%:仅在线%></option>
            <option value="offline"><%:仅离线%></option>
        </select>
        <select id="devices-filter-source" onchange="trunplay.applyFilters()">
            <option value=""><%:全部来源%></option>
            <option value="MANUAL"><%:手动添加%></option>
            <option value="DISCOVERED"><%:自动发现%></option>
        </select>
        <select id="devices-filter-sort" onchange="trunplay.applyFilters()">
            <option value="online_first"><%:在线优先%></option>
            <option value="last_seen_desc"><%:最近发现%></option>
            <option value="name_asc"><%:名称 A-Z%></option>
            <option value="name_desc"><%:名称 Z-A%></option>
        </select>
        <button class="cbi-button" onclick="trunplay.resetFilters()"><%:重置筛选%></button>
        <span id="devices-filter-meta" class="tp-filter-meta">-</span>
    </div>

    <div class="tp-inline-filters" style="margin-bottom:0;">
        <span id="devices-stat-total" class="status-badge active">总计 0</span>
        <span id="devices-stat-online" class="status-badge online">在线 0</span>
        <span id="devices-stat-offline" class="status-badge offline">离线 0</span>
    </div>
</div>

<div class="cbi-section">
    <h3>
        <%:设备列表%>
    </h3>
    <table class="cbi-section-table" id="devices-table">
        <tr class="cbi-section-table-titles">
            <th><%:名称%></th>
            <th><%:IP 地址%></th>
            <th><%:类型%></th>
            <th><%:协议%></th>
            <th><%:状态%></th>
            <th><%:来源%></th>
            <th><%:最近发现%></th>
            <th><%:操作%></th>
        </tr>
        <tr id="devices-loading">
            <td colspan="8"><%:加载中...%></td>
        </tr>
    </table>
</div>

<!-- Add Device Modal -->
<div id="device-modal" class="modal-overlay" data-close="hideModal" style="z-index:1000;">
    <div class="modal-content">
        <h3 class="modal-header">
            <%:手动添加设备%>
        </h3>

        <div class="cbi-value">
            <label class="cbi-value-title"><%:IP 地址%></label>
            <div class="cbi-value-field">
                <input type="text" id="device-address" placeholder="192.168.1.100">
            </div>
        </div>

        <div class="cbi-value">
            <label class="cbi-value-title"><%:端口%></label>
            <div class="cbi-value-field">
                <input type="number" id="device-port" value="8200" min="1" max="65535">
                <div class="cbi-value-desc">常见 DLNA 端口：8200，AirPlay 端口：7000</div>
            </div>
        </div>

        <div class="cbi-value">
            <label class="cbi-value-title"><%:协议%></label>
            <div class="cbi-value-field">
                <select id="device-protocol">
                    <option value="DLNA">DLNA</option>
                    <option value="AIRPLAY">AirPlay</option>
                </select>
            </div>
        </div>

        <div class="modal-footer">
            <button class="cbi-button" onclick="trunplay.hideModal()"><%:取消%></button>
            <button id="device-add-btn" class="cbi-button cbi-button-save" onclick="trunplay.addDevice()"><%:添加%></button>
        </div>
    </div>
</div>

<script type="text/javascript">
//<![CDATA[
var L = {
    loadFail: '<%:加载失败，请重试%>',
    enterIp: '<%:请输入 IP 地址%>',
    invalidPort: '<%:端口必须在 1-65535 之间%>',
    addSuccess: '<%:设备添加成功%>',
    addFail: '<%:添加失败，请检查 IP 地址和端口%>',
    deleteConfirm: '<%:删除后无法恢复，确定要删除吗？%>',
    deletedDevice: '<%:已删除设备%>',
    noMatch: '<%:当前筛选条件下没有匹配的设备%>',
    noData: '<%:暂无设备。请点击「扫描设备」自动发现，或「手动添加」填写 IP 与端口。%>',
    filterSummary: '<%:显示 %s / %s 个设备%>'
};

var trunplay = {
    apiBase: '<%=luci.dispatcher.build_url("admin/services/trunplay/api")%>',
    common: window.trunplayCommon || {},
    devices: [],
    filteredDevices: [],
    filters: {
        keyword: '',
        status: '',
        source: '',
        sort: 'online_first'
    },

    showMessage: function (type, text) {
        var el = document.getElementById('trunplay-message');
        if (!el) return;
        var safeText = this.escapeHtml(text);
        el.className = 'show ' + (type || 'success');
        el.innerHTML = safeText + ' <span class="trunplay-msg-close" onclick="this.parentElement.classList.remove(\'show\')" aria-label="关闭">x</span>';
        clearTimeout(window._trunplayMsgTimer);
        window._trunplayMsgTimer = setTimeout(function () { el.classList.remove('show'); }, 4000);
    },

    api: function (path, method, body, callback) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', this.apiBase, true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                var data = null;
                try { data = JSON.parse(xhr.responseText); } catch (e) { }
                if (callback) callback(data, xhr.status);
            }
        };
        var params = 'path=' + encodeURIComponent(path);
        if (method) params += '&method=' + encodeURIComponent(method);
        if (body) params += '&body=' + encodeURIComponent(JSON.stringify(body));
        xhr.send(params);
    },

    escapeHtml: function (text) {
        if (this.common && typeof this.common.escapeHtml === 'function') {
            return this.common.escapeHtml(text);
        }
        return String(text == null ? '' : text);
    },

    formatTemplate: function (tpl) {
        if (this.common && typeof this.common.formatTemplate === 'function') {
            return this.common.formatTemplate.apply(this.common, arguments);
        }
        return String(tpl || '');
    },

    formatTimestamp: function (value) {
        var ts = parseInt(value || 0, 10);
        if (!isFinite(ts) || ts <= 0) return '-';
        if (ts < 1000000000000) ts = ts * 1000;
        var d = new Date(ts);
        if (isNaN(d.getTime())) return '-';
        return d.toLocaleString();
    },

    clearTable: function () {
        var table = document.getElementById('devices-table');
        if (!table) return;
        while (table.rows.length > 1) {
            table.deleteRow(1);
        }
    },

    appendTableMessage: function (message, className) {
        var table = document.getElementById('devices-table');
        if (!table) return;
        var row = table.insertRow(-1);
        row.className = className || 'trunplay-empty-row';
        row.innerHTML = '<td colspan="8">' + this.escapeHtml(message) + '</td>';
    },

    getFilterValues: function () {
        var keywordEl = document.getElementById('devices-filter-keyword');
        var statusEl = document.getElementById('devices-filter-status');
        var sourceEl = document.getElementById('devices-filter-source');
        var sortEl = document.getElementById('devices-filter-sort');
        this.filters.keyword = keywordEl ? String(keywordEl.value || '').trim().toLowerCase() : '';
        this.filters.status = statusEl ? String(statusEl.value || '') : '';
        this.filters.source = sourceEl ? String(sourceEl.value || '') : '';
        this.filters.sort = sortEl ? String(sortEl.value || 'online_first') : 'online_first';
        return this.filters;
    },

    updateFilterMeta: function (visible, total) {
        var meta = document.getElementById('devices-filter-meta');
        if (!meta) return;
        meta.textContent = this.formatTemplate(L.filterSummary, String(visible), String(total));
    },

    updateStats: function () {
        var total = this.devices.length;
        var online = this.devices.filter(function (d) { return !!d.is_online; }).length;
        var offline = total - online;

        var totalEl = document.getElementById('devices-stat-total');
        var onlineEl = document.getElementById('devices-stat-online');
        var offlineEl = document.getElementById('devices-stat-offline');
        if (totalEl) totalEl.textContent = '总计 ' + total;
        if (onlineEl) onlineEl.textContent = '在线 ' + online;
        if (offlineEl) offlineEl.textContent = '离线 ' + offline;
    },

    applyFilters: function () {
        var filters = this.getFilterValues();
        var list = this.devices.slice();

        if (filters.keyword) {
            list = list.filter(function (device) {
                var fields = [
                    device.name,
                    device.address,
                    device.type,
                    device.manufacturer,
                    device.protocol
                ];
                return fields.some(function (field) {
                    return String(field || '').toLowerCase().indexOf(filters.keyword) >= 0;
                });
            });
        }

        if (filters.status === 'online') {
            list = list.filter(function (device) { return !!device.is_online; });
        } else if (filters.status === 'offline') {
            list = list.filter(function (device) { return !device.is_online; });
        }

        if (filters.source) {
            list = list.filter(function (device) {
                return String(device.source || 'DISCOVERED') === filters.source;
            });
        }

        var sort = filters.sort;
        list.sort(function (a, b) {
            var nameA = String(a.name || '').toLowerCase();
            var nameB = String(b.name || '').toLowerCase();

            if (sort === 'name_asc') return nameA.localeCompare(nameB);
            if (sort === 'name_desc') return nameB.localeCompare(nameA);
            if (sort === 'last_seen_desc') {
                var timeA = parseInt(a.last_seen || 0, 10) || 0;
                var timeB = parseInt(b.last_seen || 0, 10) || 0;
                if (timeA !== timeB) return timeB - timeA;
                return nameA.localeCompare(nameB);
            }

            var onlineA = !!a.is_online;
            var onlineB = !!b.is_online;
            if (onlineA !== onlineB) return onlineA ? -1 : 1;
            return nameA.localeCompare(nameB);
        });

        this.filteredDevices = list;
        this.updateFilterMeta(list.length, this.devices.length);
        this.renderDevices(list);
    },

    renderDevices: function (devices) {
        var self = this;
        this.clearTable();

        if (!this.devices.length) {
            this.appendTableMessage(L.noData, 'trunplay-empty-row');
            return;
        }

        if (!devices.length) {
            this.appendTableMessage(L.noMatch, 'trunplay-empty-row');
            return;
        }

        var table = document.getElementById('devices-table');
        devices.forEach(function (device) {
            var row = table.insertRow(-1);
            var sourceText = String(device.source || 'DISCOVERED') === 'MANUAL' ? '手动添加' : '自动发现';

            row.insertCell(0).textContent = device.name || '-';
            row.insertCell(1).textContent = device.address || '-';
            row.insertCell(2).textContent = device.type || 'MediaRenderer';
            row.insertCell(3).textContent = device.protocol || 'DLNA';

            var statusCell = row.insertCell(4);
            var badge = document.createElement('span');
            badge.className = 'status-badge ' + (device.is_online ? 'online' : 'offline');
            badge.textContent = device.is_online ? '在线' : '离线';
            statusCell.appendChild(badge);

            row.insertCell(5).textContent = sourceText;
            row.insertCell(6).textContent = self.formatTimestamp(device.last_seen);

            var actionCell = row.insertCell(7);
            var checkBtn = document.createElement('button');
            checkBtn.className = 'cbi-button';
            checkBtn.textContent = '检查状态';
            checkBtn.addEventListener('click', function () {
                self.checkStatus(device.id, checkBtn);
            });
            actionCell.appendChild(checkBtn);

            var deleteBtn = document.createElement('button');
            deleteBtn.className = 'cbi-button cbi-button-remove';
            deleteBtn.textContent = '删除';
            deleteBtn.addEventListener('click', function () {
                self.deleteDevice(device.id);
            });
            actionCell.appendChild(deleteBtn);
        });
    },

    loadDevices: function () {
        var self = this;
        var refreshBtn = document.getElementById('devices-refresh-btn');
        if (refreshBtn) {
            refreshBtn.disabled = true;
            refreshBtn.textContent = '加载中...';
        }

        this.clearTable();
        this.appendTableMessage('加载中...', 'trunplay-loading-row');

        this.api('/devices', 'GET', null, function (data, status) {
            if (refreshBtn) {
                refreshBtn.disabled = false;
                refreshBtn.textContent = '刷新';
            }

            if (status !== 200 || !Array.isArray(data)) {
                self.devices = [];
                self.clearTable();
                self.appendTableMessage(L.loadFail, 'trunplay-empty-row');
                self.updateStats();
                self.updateFilterMeta(0, 0);
                self.showMessage('error', (data && data.message) ? data.message : L.loadFail);
                return;
            }

            self.devices = data;
            self.updateStats();
            self.applyFilters();
        });
    },

    discover: function (button) {
        var self = this;
        var btn = button || document.getElementById('devices-discover-btn');
        if (btn) {
            btn.disabled = true;
            btn.textContent = '扫描中...';
        }

        this.api('/devices/discover?timeout=5', 'POST', {}, function (data, status) {
            if (btn) {
                btn.disabled = false;
                btn.textContent = '扫描设备';
            }

            if (status === 200 && data && Array.isArray(data.devices)) {
                self.showMessage('success', '发现 ' + data.devices.length + ' 个设备');
            } else {
                self.showMessage('error', (data && data.message) ? data.message : '扫描失败，请稍后重试');
            }

            self.loadDevices();
        });
    },

    showAddDevice: function () {
        document.getElementById('device-address').value = '';
        document.getElementById('device-port').value = '8200';
        document.getElementById('device-protocol').value = 'DLNA';
        document.getElementById('device-modal').classList.add('show');
        document.getElementById('device-modal').onclick = function (e) {
            if (e.target.id === 'device-modal') trunplay.hideModal();
        };
        setTimeout(function () {
            var first = document.getElementById('device-address');
            if (first) first.focus();
        }, 100);
    },

    hideModal: function () {
        document.getElementById('device-modal').classList.remove('show');
        document.getElementById('device-modal').onclick = null;
    },

    addDevice: function () {
        var address = String(document.getElementById('device-address').value || '').trim();
        var port = parseInt(document.getElementById('device-port').value, 10);
        var protocol = String(document.getElementById('device-protocol').value || 'DLNA').trim().toUpperCase();

        if (!address) {
            this.showMessage('error', L.enterIp);
            return;
        }
        if (!isFinite(port) || port < 1 || port > 65535) {
            this.showMessage('error', L.invalidPort);
            return;
        }

        var btn = document.getElementById('device-add-btn');
        if (btn) {
            btn.disabled = true;
            btn.textContent = '添加中...';
        }

        this.api('/devices/add', 'POST', { address: address, port: port, protocol: protocol }, function (data, status) {
            if (btn) {
                btn.disabled = false;
                btn.textContent = '添加';
            }

            if (status === 200 && data && data.id) {
                trunplay.hideModal();
                trunplay.loadDevices();
                trunplay.showMessage('success', L.addSuccess + ': ' + (data.name || address));
            } else {
                trunplay.showMessage('error', (data && data.message) ? data.message : L.addFail);
            }
        });
    },

    checkStatus: function (deviceId, button) {
        if (!deviceId) return;
        var btn = button || null;
        if (btn) {
            btn.disabled = true;
            btn.textContent = '检查中...';
        }

        this.api('/devices/' + encodeURIComponent(deviceId) + '/status', 'GET', null, function (data, status) {
            if (btn) {
                btn.disabled = false;
                btn.textContent = '检查状态';
            }

            if (status === 200 && data) {
                trunplay.showMessage('success', (data.name || '设备') + ': ' + (data.is_online ? '在线' : '离线'));
            } else {
                trunplay.showMessage('error', (data && data.message) ? data.message : '状态检查失败');
            }
            trunplay.loadDevices();
        });
    },

    deleteDevice: function (deviceId) {
        if (!deviceId) return;
        if (!confirm(L.deleteConfirm)) return;

        this.api('/devices/' + encodeURIComponent(deviceId), 'DELETE', null, function (result, status) {
            if (status === 200) {
                trunplay.loadDevices();
                trunplay.showMessage('success', L.deletedDevice);
            } else {
                trunplay.showMessage('error', (result && result.message) ? result.message : '删除失败');
            }
        });
    },

    resetFilters: function () {
        var keywordEl = document.getElementById('devices-filter-keyword');
        var statusEl = document.getElementById('devices-filter-status');
        var sourceEl = document.getElementById('devices-filter-source');
        var sortEl = document.getElementById('devices-filter-sort');

        if (keywordEl) keywordEl.value = '';
        if (statusEl) statusEl.value = '';
        if (sourceEl) sourceEl.value = '';
        if (sortEl) sortEl.value = 'online_first';

        this.applyFilters();
    },

    init: function () {
        var self = this;
        ['device-address', 'device-port'].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    self.addDevice();
                }
            });
        });

        var protocolEl = document.getElementById('device-protocol');
        var portEl = document.getElementById('device-port');
        if (protocolEl && portEl) {
            protocolEl.addEventListener('change', function () {
                var currentPort = String(portEl.value || '').trim();
                if (protocolEl.value === 'AIRPLAY' && currentPort === '8200') {
                    portEl.value = '7000';
                } else if (protocolEl.value === 'DLNA' && currentPort === '7000') {
                    portEl.value = '8200';
                }
            });
        }

        this.loadDevices();
    }
};

document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var open = document.querySelectorAll('.modal-overlay.show');
    if (!open.length) return;
    var top = open[open.length - 1];
    var closeFn = top.getAttribute('data-close');
    if (closeFn && trunplay[closeFn]) trunplay[closeFn]();
});

document.addEventListener('DOMContentLoaded', function () {
    trunplay.init();
});
//]]>
</script>

<%+footer%>
